name: ci

# The gate on every change: canonical form, $id = served URL, closure under
# https://schemas.desconops.org/, draft-07 compile, every example and edition record validates,
# public text clean, published versions immutable; then the site stages.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # scripts/versions.mjs reads every published version from history
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run site
