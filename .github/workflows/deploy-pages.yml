name: deploy-pages

# Serves https://schemas.desconops.org/: every schema at the path its $id names, every edition
# record at its path, plus index.json and index.html. The site is built from the files the gate
# passed; nothing else in the repository is published. The custom domain is the repository's
# Pages setting (schemas.desconops.org) with its DNS CNAME pointing at GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily: the served check also catches a host that stopped serving, or started answering
  # for paths the standard does not hold, between deploys.
  schedule:
    - cron: '41 13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'schedule'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # After every deploy, and daily: every staged file answers 200 with exactly the built bytes,
  # and a path the standard does not hold answers 404.
  served:
    needs: deploy
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run site
      # Pages' CDN can serve the previous build for a minute after a deploy: retry before failing.
      - run: for attempt in 1 2 3 4 5; do npm run served && exit 0; sleep 60; done; exit 1
